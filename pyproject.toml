[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caydence-drama"
version = "1.0.0"
description = "Caydence - Cinematic Audio Drama & Industrial Narration Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "TheClairvoyantBeing" }
]
keywords = [
    "audio",
    "tts",
    "speech-synthesis",
    "audio-drama",
    "spatial-audio",
    "dsp",
    "storytelling",
    "nvidia-nim",
    "sound-design"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "edge-tts>=6.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "soxr>=0.3.0",
    "pedalboard>=0.9.0",
    "pyloudnorm>=0.1.0",
    "pyworld>=0.3.4",
    "pyyaml>=6.0.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
]

[project.scripts]
caydence = "modules.cli:main"
caydence-pipeline = "modules.cli:pipeline_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.setuptools.package-data]
modules = ["*.yaml", "*.yml", "*.json"]
