name: Build, Release & Publish Package

on:
  push:
    branches: [main, feature/packaging]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish:
        description: 'Publish both GitHub Release and Container Package'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system audio dependencies (ffmpeg & libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run test suite
        run: |
          python -m unittest discover -s tests

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Test installation of built wheel
        run: |
          pip install dist/*.whl --force-reinstall --no-deps
          python -c "import modules; print('Installed Caydence version:', modules.__version__)"
          caydence --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caydence-dist
          path: dist/*
          retention-days: 7

  publish-release-and-package:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: caydence-dist
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "$TAG" = "feature/packaging" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          echo "Target Release Tag: $TAG"
          gh release create "$TAG" dist/* \
            --title "Caydence $TAG - Studio Audio Drama Engine" \
            --notes "Official release of Caydence. Includes pre-built pip wheels (.whl) and source distribution (.tar.gz)." \
            --generate-notes || gh release upload "$TAG" dist/* --clobber

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.tag_name || 'v1.0.0' }}

      - name: Build and push Docker image to GitHub Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows-exe:
    needs: publish-release-and-package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Single-File Windows Executable
        run: |
          pyinstaller caydence_windows.spec

      - name: Upload Windows Binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "$TAG" = "feature/packaging" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          echo "Uploading caydence-windows-x64.exe to Release $TAG..."
          gh release upload "$TAG" dist/caydence-windows-x64.exe --clobber

