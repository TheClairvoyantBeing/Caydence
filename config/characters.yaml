# Character definitions and acoustic profiles for Caydence audio dramas.
# Configures VoiceProvider, age profile, acoustic EQ carving, gain, and stereo placement.

characters:
  arthur:
    display_name: "Arthur Vance"
    age: 62
    age_profile: "elder_62"
    gender: "male"
    role: "Senior Archivist / Reluctant Survivor"
    provider: "edge_tts"
    voice: "en-US-RogerNeural"
    fallback_voice: "en-US-SteffanNeural"
    reference_audio: "voice_samples/1_Mr_Nightmare_Grounded_Baritone/narrator_22k.wav"
    chatterbox_params:
      exaggeration: 0.55
      cfg_weight: 0.50
    rate: "-5%"
    pitch: "-2Hz"
    gain_db: 1.5
    pan: -0.30
    eq:
      low_shelf_gain_db: 2.0
      low_shelf_cutoff_hz: 180
